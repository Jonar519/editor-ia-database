# Cuaderno · servicios locales de desarrollo.
# Puertos propios (5435 y 6381) para no chocar con otros proyectos de la máquina.
# Solo escuchan en 127.0.0.1. La contraseña sale de .env (scripts\env-init.bat).
name: cuaderno

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cuaderno_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-cuaderno}
      POSTGRES_PASSWORD: ${PGPASSWORD:?Falta PGPASSWORD en .env. Ejecuta scripts\env-init.bat}
      POSTGRES_DB: ${CUADERNO_DEV_DB:-cuaderno}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${PGPORT:-5435}:5432"
    volumes:
      - cuaderno_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: cuaderno_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"
    volumes:
      - cuaderno_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  cuaderno_pgdata:
  cuaderno_redisdata:
